<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>Verify your email — Poffu</title>
  <!--
    PASTE THIS ENTIRE FILE into Supabase Dashboard →
    Authentication → Email Templates → "Confirm signup" → Message body.

    Suggested Subject line (paste into the Subject field, not here):
    Your Poffu verification code: {{ .Token }}

    {{ .Token }} = the 6-digit code the app's code box verifies.
    {{ .ConfirmationURL }} = fallback "tap to confirm" link.
  -->
  <style>
    @media only screen and (max-width: 600px) {
      .card { padding: 36px 24px !important; }
      .code { font-size: 32px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f2f2f7;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f2f7;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" class="card" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#ffffff;border-radius:20px;padding:48px 40px;">
          <tr>
            <td align="center" style="padding-bottom:24px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;color:#1c1c1e;letter-spacing:-0.5px;">
              Poffu
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:12px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif;font-size:26px;font-weight:700;color:#1c1c1e;letter-spacing:-0.5px;">
              Verify your email
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:32px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;font-weight:400;color:#6e6e73;line-height:24px;">
              Enter this code in the app to finish creating your account.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:16px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f2f7;border-radius:16px;">
                <tr>
                  <td align="center" class="code" style="padding:20px 36px 20px 46px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif;font-size:38px;font-weight:700;letter-spacing:10px;color:#1c1c1e;">
                    {{ .Token }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:32px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:400;color:#aeaeb2;">
              The code expires in a few minutes.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:12px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:400;color:#6e6e73;">
              Prefer a link instead?
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:40px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#3394FA;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;text-decoration:none;padding:14px 36px;border-radius:26px;">
                Confirm email
              </a>
            </td>
          </tr>
          <tr>
            <td align="center" style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400;color:#aeaeb2;line-height:20px;">
              If you didn't create a Poffu account, you can safely ignore this email.
            </td>
          </tr>
        </table>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
          <tr>
            <td align="center" style="padding-top:24px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400;color:#c7c7cc;">
              © Poffu
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
